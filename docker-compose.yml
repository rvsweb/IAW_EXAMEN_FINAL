version: '3.8'

services:
  web:
    build: .
    container_name: lamp_apache
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
      - ./basedatos:/var/www/basedatos
      - ./utils:/var/www/utils
      - ./plantilla:/var/www/plantilla
    depends_on:
      - db
    networks:
      - lamp_network

  db:
    image: mysql:8.0
    container_name: lamp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: videojuegos_db
      MYSQL_USER: alumno
      MYSQL_PASSWORD: alumno123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - lamp_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lamp_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - lamp_network

networks:
  lamp_network:
    driver: bridge

volumes:
  mysql_data:
